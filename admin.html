<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Casamento Ana & Anderson</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header {
            padding: 50px 0;
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--clr-white);
            padding: 25px;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--glass-shadow);
        }
        .stat-number {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--clr-accent);
        }
        .rsvp-list {
            margin-top: 50px;
        }
        .rsvp-table-container {
            background: var(--clr-white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid var(--clr-border);
        }
        th {
            background: var(--clr-bg-alt);
            font-weight: 700;
            color: var(--clr-text-main);
        }
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-sim { background: #e8f5e9; color: #2e7d32; }
        .badge-nao { background: #ffebee; color: #c62828; }
        .btn-wa {
            background: #25d366;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-wa:hover {
            background: #128c7e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--clr-bg-main);
            z-index: 10002;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            text-align: center;
        }
        .whatsapp-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div id="login-overlay">
        <h2 style="margin-bottom: 10px; font-family: var(--font-ui);">Acesso Restrito</h2>
        <p style="margin-bottom: 30px; color: var(--clr-text-sub);">Dica: Use a senha padrão configurada.</p>
        <div class="form-group" style="width: 100%; max-width: 320px;">
            <input type="password" id="admin-pass" placeholder="Senha de Acesso" class="form-control" style="text-align: center;">
        </div>
        <button onclick="checkAdmin()" class="btn btn-primary" style="margin-top: 15px; width: 100%; max-width: 320px;">Entrar no Painel</button>
    </div>

    <div class="container" id="admin-content" style="display: none; padding-top: 50px;">
        <div class="admin-header">
            <h1 class="font-romantic" style="font-size: 4.5rem; color: var(--clr-text-main);">Presenças Confirmadas</h1>
            <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; color: var(--clr-accent);">Painel de Gestão de Convidados</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span id="total-confirmados" class="stat-number">0</span>
                <span style="font-size: 0.85rem; text-transform: uppercase; font-weight: 600;">Sim, irei!</span>
            </div>
            <div class="stat-card">
                <span id="total-recusados" class="stat-number">0</span>
                <span style="font-size: 0.85rem; text-transform: uppercase; font-weight: 600;">Não poderei ir</span>
            </div>
            <div class="stat-card">
                <span id="total-geral" class="stat-number">0</span>
                <span style="font-size: 0.85rem; text-transform: uppercase; font-weight: 600;">Total de Respostas</span>
            </div>
        </div>

        <div class="rsvp-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Convidado</th>
                        <th>Presença</th>
                        <th>Telefone / WhatsApp</th>
                        <th>Data</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="rsvp-body">
                    <!-- Os dados serão injetados aqui -->
                </tbody>
            </table>
        </div>
        
        <div style="margin-top: 40px; text-align: center;">
             <button onclick="clearRsvps()" class="btn" style="background: transparent; color: #999; font-size: 0.75rem; border: 1px solid #ddd; padding: 10px 20px;">Limpar Todos os Registros Locais</button>
        </div>
    </div>

    <script>
        // Senha de demonstração (Pode ser alterada)
        const ADMIN_PASSWORD = "anaeanderson"; 

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadRsvps();
            } else {
                alert("Senha incorreta");
            }
        }

        // Permitir Enter no campo de senha
        document.getElementById('admin-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkAdmin();
        });

        function loadRsvps() {
            const rsvps = JSON.parse(localStorage.getItem('wedding_rsvps') || '[]');
            const body = document.getElementById('rsvp-body');
            body.innerHTML = '';

            let confirmados = 0;
            let recusados = 0;

            // Inverter para mostrar os mais recentes primeiro
            const sortedRsvps = [...rsvps].reverse();

            sortedRsvps.forEach(rsvp => {
                if (rsvp.attendance === 'sim') confirmados++;
                else recusados++;

                const tr = document.createElement('tr');
                const cleanPhone = rsvp.phone.replace(/\D/g, '');
                
                tr.innerHTML = `
                    <td><strong style="color: var(--clr-text-main)">${rsvp.name}</strong></td>
                    <td><span class="badge badge-${rsvp.attendance}">${rsvp.attendance === 'sim' ? 'SIM' : 'NÃO'}</span></td>
                    <td>${rsvp.phone}</td>
                    <td style="font-size: 0.8rem; color: #999;">${rsvp.date || '-'}</td>
                    <td>
                        <a href="https://wa.me/55${cleanPhone}" target="_blank" class="btn-wa">
                            <svg class="whatsapp-icon" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.1-16.4-14.6-27.4-32.7-30.6-38.2-3.2-5.6-.3-8.6 2.5-11.3 2.5-2.5 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.5 5.5-9.3.9-1.9.5-3.3-.2-4.7-1.4-1.4-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.3 4.2 25.4 3.6 35 2.2 10.7-1.5 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
                            Falar no WhatsApp
                        </a>
                    </td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('total-confirmados').innerText = confirmados;
            document.getElementById('total-recusados').innerText = recusados;
            document.getElementById('total-geral').innerText = rsvps.length;
        }

        function clearRsvps() {
            if (confirm("Deseja realmente apagar todos os registros da lista? Isso não pode ser desfeito.")) {
                localStorage.removeItem('wedding_rsvps');
                loadRsvps();
            }
        }
    </script>
</body>
</html>
